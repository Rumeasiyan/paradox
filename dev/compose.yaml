# Local stack for development and tests. Not a deployment: passwords and
# ports here are throwaway values for this machine only.
#
#   docker compose -f dev/compose.yaml up -d
#   export PARADOX_TEST_DATABASE_URL=postgres://paradox:paradox@localhost:6432/paradox
#   go test ./...
#
# PgBouncer runs in session mode with a pool of 2, as in the reference
# deployment (PRD Annex B, links 5 and 6), so tests meet the same limits.
name: paradox-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d paradox"]
      interval: 2s
      timeout: 2s
      retries: 30

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASE_URL: postgres://paradox:paradox@postgres:5432/paradox
      POOL_MODE: session
      DEFAULT_POOL_SIZE: "2"
      MAX_CLIENT_CONN: "50"
      AUTH_TYPE: scram-sha-256
    ports:
      - "127.0.0.1:6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
