name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: paradox
          POSTGRES_PASSWORD: paradox
          POSTGRES_DB: paradox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paradox -d paradox"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      PARADOX_TEST_DATABASE_URL: postgres://paradox:paradox@localhost:5432/paradox
      PARADOX_TEST_DIRECT_URL: postgres://paradox:paradox@localhost:5432/paradox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./... ./sign/...
      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Tests (database tests share one database)
        run: go test -count=1 -race -p 1 ./... ./sign/...
