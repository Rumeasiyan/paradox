name: image

# Publishes the image only when a version tag (v1.2.3) is pushed. The tag
# must equal the VERSION file; the image is tagged with it and never with
# "latest", so deployments pin an exact version.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches VERSION
        run: |
          want="v$(cat VERSION)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION ($want)"; exit 1
          fi
          echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          push: true
          tags: ghcr.io/rumeasiyan/paradox:v${{ env.VERSION }}
